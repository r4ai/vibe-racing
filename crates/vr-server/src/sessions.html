              { title: e.lap + "周目・前後" + e.laps_before + "/" + e.laps_after + "周" },
              el("h3", null, e.control + " " + +e.from.toFixed(2) + "→" + +e.to.toFixed(2)),
              el(
                "p",
                null,
                "1周 " + signed(e.lap_time_s, 2) + "秒",
                el(
                  "small",
                  null,
                  [
                    ["アンダー", e.understeer_s],
                    ["オーバー", e.oversteer_s],
                    ["空転", e.wheelspin_s],
                  ]
                    .filter(([, v]) => v !== null && Math.abs(v) >= 0.1)
                    .map(([n, v]) => n + signed(v, 1))
                    .join("　"),
                ),
              ),
            ),
          );
        if (found.length)
          parts.push(el("section", null, el("h2", null, "打ち手"), el("ol", null, found)));
        if (tries.length)
          parts.push(
            el("section", null, el("h2", null, "走行中の変更の結果"), el("ol", null, tries)),
          );
        return parts.length ? el("div", { className: "diagnosis" }, parts) : null;
      }

      function balanceBars(b) {
        const scale = Math.max(1, ...b.by_speed.flatMap((x) => [x.understeer_s, x.oversteer_s]));
        const row = (name, x) => {
          const bar = (v, cls) => {
            const e = el("i", { className: cls });
            e.style.width = (v / scale) * 100 + "%";
            return e;
          };
          return [
            el("b", null, x.understeer_s.toFixed(1)),
            el("div", { className: "u" }, bar(x.understeer_s, "under")),
            el("span", null, name),
            el("div", null, bar(x.oversteer_s, "over")),
            el("b", null, x.oversteer_s.toFixed(1)),
          ];
        };
        return el(
          "div",
          { className: "sides", title: "1周あたりの秒数（入力と動きからの推定）" },
          [el("i"), el("i", null, "アンダー"), el("i"), el("i", null, "オーバー"), el("i")],
          ["低速", "中速", "高速"].map((n, i) => row(n, b.by_speed[i])),
        );
      }

      const words = (s) => s.replace(/([a-z])([A-Z0-9])/g, "$1 $2");
      function drawSetup() {
        const stage = $("stage"),
          setup = record.setup;
        const id = record.id;
        if (!analyses.has(id)) {
          analyses.set(id, null);
          json(sessionPath(id) + "/analysis").then((a) => {
            analyses.set(id, a);
            if (view === "setup" && record.id === id) drawSetup();
          });
        }
        const found = analyses.get(id);
        const diagnosis = found?.findings ? drawAnalysis(found) : null;
        if (!setup?.items.length) {
          if (diagnosis) return stage.replaceChildren(diagnosis);
          stage.replaceChildren(
            el("p", { className: "empty" }, "セットアップの記録がありません。"),
          );
          return;
        }
        const theirs = new Map((rival?.setup?.items || []).map((i) => [i.path, i.value]));
        const value = (path, v) => {
          const o = theirs.get(path);
          return o !== undefined && o !== v
            ? el("span", { className: "v diff" }, el("s", null, o), v)
            : el("span", { className: "v" }, v ?? "");
        };
        const corner = new Map(),
          groups = new Map();
        for (const i of setup.items) {
          const path = i.path.split("/"),
            at = path.findIndex((p) => CORNERS.includes(p)),
            name = path[path.length - 1].replace(/OMI$|IMO$/, "");
          if (at >= 0) {
            if (!corner.has(name)) corner.set(name, {});
            corner.get(name)[path[at]] = i;
          } else {
            const g = path.slice(0, -1).join("・");
            if (!groups.has(g)) groups.set(g, []);
            groups.get(g).push([name, i]);
          }
        }
        const sections = [];
        if (corner.size) {
          const cells = [el("span"), ...CORNER_NAMES.map((n) => el("span", { className: "h" }, n))];
          for (const [name, by] of corner) {
            cells.push(el("span", { className: "k", title: words(name) }, words(name)));
            for (const c of CORNERS)
              cells.push(by[c] ? value(by[c].path, by[c].value) : el("span"));
          }
          sections.push(
            el(
              "section",
              { className: "wide" },
              el("h2", null, "四輪"),
              el("div", { className: "grid four" }, cells),
            ),
          );
        }
        for (const [g, items] of groups)
          sections.push(
            el(
              "section",
              null,
              el("h2", null, words(g)),
              el(
                "div",
                { className: "grid one" },
                items.map(([name, i]) => [
                  el("span", { className: "k", title: words(name) }, words(name)),
                  value(i.path, i.value),
                ]),
              ),
            ),
          );
        stage.replaceChildren(
          ...[diagnosis, el("div", { className: "garage" }, sections)].filter(Boolean),
        );
      }

      /* ---- The page ---- */
      function draw() {
        const setup = view === "setup";
        $("stage").className = setup ? "setup" : "";
        if (setup) drawSetup();
        else if (view === "telemetry") drawLanes();
        else drawRace();
      }

      function figures(r) {
        const times = r.laps.map((l) => l.time_s).filter((t) => t > 0);
        const good = r.laps.filter(clean);
        const fuel = good.map((l) => l.fuel_used_l).filter((f) => f > 0);
        return {
          best: times.length ? Math.min(...times) : r.player?.best_lap_s,
          average: mean(good.map((l) => l.time_s)),
          fuel: mean(fuel),
        };
      }

      function drawMain() {
        const r = record,
          [name, layout] = short(r.track),
          f = figures(r),
          o = rival && figures(rival);
        const than = (a, b, digits) =>
          o && a > 0 && b > 0 ? el("u", { className: "other" }, signed(a - b, digits)) : null;
        const fact = (label, big, small) =>
          el("div", null, el("i", null, label), el("b", null, big), small);
        const p = r.player?.car.position,
          began = positions(r)[0]?.[1];
        const moved = p && began ? began - p : 0;
        const bestLap = r.laps.find((l) => l.time_s === f.best)?.lap;
        const weather = r.weather
          ? [
              { dry: "ドライ" }[r.weather.wetness] || r.weather.wetness,
              r.weather.track_temp_c ? "路面" + Math.round(r.weather.track_temp_c) + "℃" : null,
            ]
          : [];
        const compare = el(
          "select",
          { title: "比べるセッション" },
          el("option", { value: "" }, "比べる…"),
        );
        compare.setAttribute("aria-label", "比べるセッション");
        for (const s of sessions)
          if (s.id !== r.id && s.track === r.track)
            compare.append(
              el(
                "option",
                { value: s.id, selected: s.id === rival?.id },
                dayName(s.started_ms) + " " + hour(s.started_ms) + " " + (KIND[s.kind] || s.kind),
              ),
            );
        compare.onchange = async () => {
          rival = compare.value ? await load(compare.value) : null;
          drawMain();
        };
        const tab = (id, text) => {
          const b = el("button", { type: "button" }, text);
          b.setAttribute("aria-pressed", view === id);
          b.onclick = () => {
            view = id;
            focus = null;
            drawMain();
          };
          return b;
        };
        $("main").replaceChildren(
          el(
            "div",
            { className: "top" },
            el(
              "div",
              { className: "name" },
              el("h1", { title: r.track || "" }, name, layout ? el("small", null, layout) : null),
              el(
                "div",
                { className: "meta" },
                [
                  KIND[r.kind] || r.kind,
                  dayName(r.started_ms) + " " + hour(r.started_ms),
                  r.car,
                  ...weather,
                ]
                  .filter(Boolean)
                  .join("・"),
              ),
            ),
            el(
              "div",
              { className: "tools" },
              view !== "telemetry" && compare.options.length > 1 ? compare : null,
              el(
                "div",
                { className: "switch" },
                tab("telemetry", "テレメトリ"),
                tab("race", "レース"),
                tab("setup", "セットアップ"),
              ),
            ),
          ),
          el(
            "div",
            { className: "facts" },
            view === "telemetry" && tele.a
              ? telemetryFigures()
              : [
                  p
                    ? fact(
                        "順位",
                        String(p),
                        el(
                          "u",
                          null,
                          "/" +
                            r.player.cars_total +
                            (moved ? (moved > 0 ? "　↑" : "　↓") + Math.abs(moved) : ""),
                        ),
                      )
                    : null,
                  fact(
                    "ベスト",
                    lapTime(f.best),
                    than(f.best, o?.best, 3) || (bestLap ? el("u", null, bestLap + "周目") : null),
                  ),
                  fact("平均", lapTime(f.average), than(f.average, o?.average, 3)),
                  fact(
                    "燃費",
                    f.fuel ? f.fuel.toFixed(2) : "−",
                    than(f.fuel, o?.fuel, 2) || (f.fuel ? el("u", null, "L/周") : null),
                  ),
                  fact("インシデント", String(r.player?.incidents ?? 0), el("u", null, "x")),
                  fact("周回", String(r.laps_completed)),
                ],
          ),
          el("div", { id: "stage" }),
        );
        if (view === "telemetry") drawTelemetrySide();
        else {
          drawResult();
          drawLook(null);
        }
        draw();
      }

      const load = async (id) => {
        const res = await fetch("/v1/sessions/" + encodeURIComponent(id));
        return res.ok ? res.json() : null;
      };

      let wanted = null;
      async function show(id) {
        wanted = id;
        const r = await load(id);
        if (wanted !== id) return;
        rival = null;
        focus = null;
        record = r;
        drawList();
        if (r) {
          const t = await openTelemetry(r);
          if (wanted !== id) return;
          tele = t;
          await compareLaps();
          if (wanted !== id) return;
          drawMain();
        } else $("main").replaceChildren(el("p", { className: "empty" }, "見つかりません。"));
      }

      $("filter").oninput = drawList;
      const hash = () => decodeURIComponent(location.hash.slice(1));
      onhashchange = () => show(hash());
      onkeydown = (ev) => {
        const step = { ArrowUp: -1, ArrowDown: 1 }[ev.key];
        if (!step || ev.target.tagName === "SELECT" || !record) return;
        const list = shown(),
          i = list.findIndex((s) => s.id === record.id);
        const next = list[i + step];
        if (next) {
          location.hash = next.id;
          ev.preventDefault();
        }
      };
      onresize = () => {
        if (!record || view === "setup") return;
        draw();
        drawMap();
      };
      fetch("/v1/sessions")
        .then((r) => r.json())
        .then((list) => {
          sessions = list;
          drawList();
          const id = hash() || list[0]?.id;
          if (id) show(id);
          else
            $("main").replaceChildren(
              el("p", { className: "empty" }, "走ると、ここに記録が残ります。"),
            );
        });
    </script>
  </body>
</html>
