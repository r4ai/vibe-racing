# cargo-mutants configuration. Every exclusion needs a reason.
# Patterns are regexes matched against the mutant name; use TOML literal
# strings ('...') so backslashes reach the regex engine unchanged.

# vr-radio/src/app/view.rs: layout and styling only. The states it shows
# (Phase, TurnView, latency) are tested in app.rs; the look is reviewed with
# `cargo run -p vr-radio --example snapshot`.
# vr-radio/src/main.rs: window options and startup wiring (also outside coverage).
exclude_globs = ["crates/vr-radio/src/app/view.rs", "crates/vr-radio/src/main.rs"]

exclude_re = [
    # vr-iracing/src/shm.rs `imp`: the live Win32 mapping and its non-Windows
    # stub. Only testable against a running iRacing; the parsing it feeds is
    # covered through `MemoryImage`.
    'imp::',
    # vr-iracing::open_live, vr-ams2::open_live: open the live mapping (see
    # above).
    'replace open_live ',
    # Equivalent: the fuel baseline is only ever read for the player's car,
    # so also storing it for other cars is unobservable.
    'replace match guard is_player with true in RaceState::track_laps',
    # Equivalent: CAUTION and CAUTION_WAVING are disjoint bits, so `|` and `^`
    # build the same mask.
    'replace \| with \^ in flags',
    # Log-only: whether "waiting for game" is warned once or on every retry.
    'delete ! in spawn_collector',
    # vr-replay/src/synth.rs internals: a demo/test-data generator, not product
    # logic. Its observable race (pit laps, flags, fuel, finishing order) is
    # pinned by tests/replay.rs `synthetic_race_story` and the engine tests;
    # exact pace formulas and PRNG bits are deliberately free to change.
    'SynthCar::',
    ' noise',
    'in SynthSource::(step|frame)',
    # Pacing offset by one step: the synthetic race starts one tick earlier.
    'replace \+ with - in <impl TelemetrySource for SynthSource>::poll',
    # Equality boundaries on wall-clock waits (`t < t0`, `wait > timeout`) and
    # on the recorder's float epsilon: indistinguishable without a fake clock.
    'replace < with <= in Pacer::wait_until',
    'replace > with >= in Pacer::wait_until',
    'replace < with <= in Recorder::record',
    # vr-radio hardware and window glue: the default microphone / output device
    # threads, the global hotkey poller and the code that wires real devices
    # into the engine. Exercised by `vr-radio --ask`; the engine they feed is
    # tested with fakes (engine.rs, agent.rs).
    'in Mic::open',
    'replace capture ',
    'in capture',
    'replace open_input ',
    'in open_input',
    '<impl Drop for Mic>',
    '<impl Recorder for Mic>',
    'in Speakers::',
    'replace Speakers::',
    '<impl Output for Speakers>',
    '<impl Output for Silent>',
    'replace start_engine ',
    'in start_engine',
    'replace subscription ',
    'in engine_stream',
    'in hotkey_stream',
    # vr-radio/src/chrome.rs: the Win32 window subclass and its installation
    # act only inside a real window (checked by hand: snap layouts, drag,
    # maximize, hit tests via WM_NCHITTEST). `hit_test` itself is tested.
    'in win32::',
    'replace win32::',
    'install_native_chrome',
    'in chrome_stream',
    # vr-radio: real controllers, tray, registry and OS key registration
    # (needs the hardware or the desktop). `Held`, `device_key`, `capture`
    # and the app's reactions to them are tested.
    'raw_input::',
    'stub::',
    'replace (listen|bind|unbind|connect|show_window|captured_key) ',
    'in (listen|bind|unbind|connect|show_window|captured_key)$',
    'in wheel_stream',
    'in resident_stream',
    'App::close',
    # Which event streams run is window wiring.
    'in subscription',
    # Equivalent on Windows (the list always offers it there); caught elsewhere.
    'replace == with != in App::stt_choices',
    # Pixel art of the tray icon; its shape is tested at a few points.
    'in icon_rgba',
    # Waits for the recognizer process; only its absence of answers differs.
    '<impl Drop for LineProcess>',
    'in App::boot',
    'replace App::boot',
    'replace (main|ask_once) ',
    'in (main|ask_once)$',
    # vr-ac: the live Win32 mapping (`imp::`) and `open_live` are matched by
    # the vr-iracing patterns above; the parsing is covered through
    # `MemoryPages`.
    # Equality boundary on a wall-clock silence (`elapsed() > SILENT`).
    'replace > with >= in <impl TelemetrySource for UdpSource>::poll',
    # Equivalent: a cut cannot begin where the one before it ends, the revs and
    # the speed being flat over the points before it, so skipping that point too
    # changes nothing.
    'replace < with <= in clips',
    # Equivalent: NoMic::stop already returns the default recording.
    'replace <impl Recorder for NoMic>::stop -> Recording with Default::default\(\)',
    # Equivalent: `begin()` assigns strictly increasing turn numbers, so `words()`
    # is never called twice with `turn == self.newest`.
    'replace < with <= in Engine::words',
    # Returning `Ok(())` immediately closes the fake ACP session before any test
    # turn can start, making reconnect-loop tests wait until the mutant timeout.
    'replace sessions ',
    # Dropping the entire command dispatcher makes every async engine test wait
    # for its channel timeout, hitting cargo-mutants's aggregate timeout; every
    # branch inside `Engine::command` is still mutated individually.
    'replace Engine::command with \(\)',
]
